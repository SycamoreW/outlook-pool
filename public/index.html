<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outlook Pool · 邮箱池控制台</title>
<meta name="color-scheme" content="dark light">
<script>if (location.pathname === '/pool' || location.pathname.startsWith('/pool/')) document.write('<base href="/pool/">');</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6bff'/%3E%3Cpath d='M7 11.5 16 17l9-5.5V21a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z' fill='%23fff'/%3E%3Cpath d='M7 10.8A2 2 0 0 1 9 9h14a2 2 0 0 1 2 1.8L16 16.4z' fill='%23cfe0ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="app">

  <!-- ======= 顶栏 ======= -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M7 11.5 16 17l9-5.5V21a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z" fill="#fff"/><path d="M7 10.8A2 2 0 0 1 9 9h14a2 2 0 0 1 2 1.8L16 16.4z" fill="#cfe0ff"/></svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">Outlook Pool</span>
        <span class="brand-sub" id="headerStats">加载中…</span>
      </div>
    </div>

    <div class="topbar-actions">
      <button class="btn btn-primary" id="btnImport" aria-label="批量导入">
        <svg class="ic" viewBox="0 0 16 16"><path d="M8 1.5a.75.75 0 0 1 .75.75v6.19l2.22-2.22a.75.75 0 1 1 1.06 1.06l-3.5 3.5a.75.75 0 0 1-1.06 0l-3.5-3.5a.75.75 0 0 1 1.06-1.06l2.22 2.22V2.25A.75.75 0 0 1 8 1.5ZM2.75 12a.75.75 0 0 1 .75.75v.75h9v-.75a.75.75 0 0 1 1.5 0v1.5a.75.75 0 0 1-.75.75H2.75a.75.75 0 0 1-.75-.75v-1.5a.75.75 0 0 1 .75-.75Z"/></svg>
        <span>批量导入</span>
      </button>
      <button class="btn" id="btnCheckAll" aria-label="全部检查">
        <svg class="ic" viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 1 0 5.5 5.5.75.75 0 0 1 1.5 0A7 7 0 1 1 8 1a.75.75 0 0 1 0 1.5Zm6.03.72a.75.75 0 0 1 0 1.06l-5.5 5.5a.75.75 0 0 1-1.06 0l-2-2a.75.75 0 1 1 1.06-1.06L8 8.19l4.97-4.97a.75.75 0 0 1 1.06 0Z"/></svg>
        <span>全部检查</span>
      </button>
      <div class="menu-wrap">
        <button class="btn btn-icon" id="btnMore" aria-haspopup="true" aria-expanded="false" title="更多操作">
          <svg class="ic" viewBox="0 0 16 16"><path d="M8 4.5A1.25 1.25 0 1 1 8 2a1.25 1.25 0 0 1 0 2.5Zm0 4.75a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5ZM8 14a1.25 1.25 0 1 1 0-2.5A1.25 1.25 0 0 1 8 14Z"/></svg>
        </button>
        <div class="menu" id="moreMenu" hidden>
          <button class="menu-item" id="btnApiDocs">
            <svg class="ic" viewBox="0 0 16 16"><path d="M4.72 3.22a.75.75 0 0 1 1.06 1.06L3.06 7l2.72 2.72a.75.75 0 1 1-1.06 1.06L1.47 7.53a.75.75 0 0 1 0-1.06Zm6.56 0a.75.75 0 1 0-1.06 1.06L12.94 7l-2.72 2.72a.75.75 0 1 0 1.06 1.06l3.25-3.25a.75.75 0 0 0 0-1.06Z"/></svg>
            快速 API 文档
          </button>
          <button class="menu-item" id="btnExport">
            <svg class="ic" viewBox="0 0 16 16"><path d="M8 10.5a.75.75 0 0 1-.53-.22l-3.5-3.5a.75.75 0 1 1 1.06-1.06L7.25 7.94V1.75a.75.75 0 0 1 1.5 0v6.19l2.22-2.22a.75.75 0 1 1 1.06 1.06l-3.5 3.5a.75.75 0 0 1-.53.22ZM3.5 13a.75.75 0 0 0 0 1.5h9a.75.75 0 0 0 0-1.5Z"/></svg>
            导出全部账号
          </button>
          <button class="menu-item menu-item-danger" id="btnClearDead">
            <svg class="ic" viewBox="0 0 16 16"><path d="M6.5 1.75V3h3V1.75a.25.25 0 0 0-.25-.25h-2.5a.25.25 0 0 0-.25.25ZM11 3V1.75A1.75 1.75 0 0 0 9.25 0h-2.5A1.75 1.75 0 0 0 5 1.75V3H1.75a.75.75 0 0 0 0 1.5h.443l.674 9.435A1.75 1.75 0 0 0 4.613 15.5h6.774a1.75 1.75 0 0 0 1.746-1.565L13.807 4.5h.443a.75.75 0 0 0 0-1.5Z"/></svg>
            清理失效账号
          </button>
          <div class="menu-sep"></div>
          <button class="menu-item" id="btnTheme">
            <svg class="ic" viewBox="0 0 16 16"><path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0-10.5a.75.75 0 0 1 .75.75v.5a.75.75 0 0 1-1.5 0v-.5A.75.75 0 0 1 8 1.5Zm0 11.5a.75.75 0 0 1 .75.75v.5a.75.75 0 0 1-1.5 0v-.5A.75.75 0 0 1 8 13Zm6.5-5a.75.75 0 0 1-.75.75h-.5a.75.75 0 0 1 0-1.5h.5a.75.75 0 0 1 .75.75ZM3.5 8a.75.75 0 0 1-.75.75h-.5a.75.75 0 0 1 0-1.5h.5A.75.75 0 0 1 3.5 8Zm8.92-4.42a.75.75 0 0 1 0 1.06l-.35.36a.75.75 0 1 1-1.07-1.06l.36-.36a.75.75 0 0 1 1.06 0ZM5 12.06a.75.75 0 0 1 0 1.06l-.35.36a.75.75 0 0 1-1.07-1.06l.36-.36a.75.75 0 0 1 1.06 0Zm7.42 1.42a.75.75 0 0 1-1.06 0l-.36-.35a.75.75 0 1 1 1.06-1.07l.36.36a.75.75 0 0 1 0 1.06ZM4.94 5a.75.75 0 0 1-1.06 0l-.36-.35A.75.75 0 0 1 4.58 3.58l.36.36a.75.75 0 0 1 0 1.06Z"/></svg>
            <span id="themeLabel">切换主题</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ======= 三栏主体 ======= -->
  <main class="layout" id="layout" data-pane="accounts">

    <!-- 账号列表 -->
    <section class="pane pane-accounts" aria-label="账号列表">
      <div class="pane-head">
        <div class="search">
          <svg class="ic" viewBox="0 0 16 16"><path d="M10.68 11.74a6 6 0 1 1 1.06-1.06l2.79 2.79a.75.75 0 1 1-1.06 1.06ZM11.5 7a4.5 4.5 0 1 0-9 0 4.5 4.5 0 0 0 9 0Z"/></svg>
          <input type="search" id="searchInput" placeholder="搜索邮箱…" autocomplete="off" spellcheck="false">
        </div>
        <div class="filter-row" id="filterRow" role="tablist" aria-label="状态筛选"></div>
      </div>
      <div class="pane-body" id="accountList" role="list"></div>
    </section>

    <!-- 邮件列表 -->
    <section class="pane pane-messages" aria-label="邮件列表">
      <div class="pane-head msg-head" id="msgHead" hidden>
        <button class="btn btn-icon btn-ghost back-btn" id="btnBackAccounts" title="返回账号列表">
          <svg class="ic" viewBox="0 0 16 16"><path d="M9.78 12.78a.75.75 0 0 1-1.06 0L4.47 8.53a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 1.06L6.06 8l3.72 3.72a.75.75 0 0 1 0 1.06Z"/></svg>
        </button>
        <div class="msg-head-main">
          <div class="msg-head-email mono" id="msgHeadEmail"></div>
          <div class="msg-head-sub">
            <div class="seg" role="tablist" aria-label="文件夹">
              <button class="seg-btn active" data-folder="inbox" role="tab">收件箱</button>
              <button class="seg-btn" data-folder="junkemail" role="tab">垃圾箱</button>
            </div>
            <select id="topSelect" class="select-sm" title="拉取数量">
              <option value="10">10 封</option>
              <option value="25" selected>25 封</option>
              <option value="50">50 封</option>
            </select>
          </div>
        </div>
        <button class="btn btn-icon btn-ghost" id="btnReloadMsgs" title="刷新邮件">
          <svg class="ic" viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89l.86-.86A.75.75 0 0 1 14 3.78V6.5a.75.75 0 0 1-.75.75h-2.72a.75.75 0 0 1-.53-1.28l.83-.83A4 4 0 1 0 12 8a.75.75 0 0 1 1.5 0Z"/></svg>
        </button>
      </div>
      <div class="pane-body" id="messageList"></div>
    </section>

    <!-- 正文阅读 -->
    <section class="pane pane-detail" aria-label="邮件正文">
      <div class="pane-body" id="messageDetail"></div>
    </section>
  </main>

  <!-- ======= 导入弹窗 ======= -->
  <div class="modal-backdrop" id="importModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="importTitle">
      <div class="modal-head">
        <h2 id="importTitle">批量导入账号</h2>
        <button class="btn btn-icon btn-ghost modal-close" data-close="importModal" title="关闭">
          <svg class="ic" viewBox="0 0 16 16"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <p class="hint">每行一个账号，格式：<code>邮箱----密码----client_id----refresh_token</code><br>密码可留空；同邮箱重复导入会自动覆盖并重置状态。</p>
        <textarea id="importText" rows="10" placeholder="user1@outlook.com----pass----xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx----0.AXoA…" spellcheck="false"></textarea>
        <div class="import-meta" id="importMeta"></div>
        <div class="import-result" id="importResult" hidden></div>
      </div>
      <div class="modal-foot">
        <button class="btn" data-close="importModal">取消</button>
        <button class="btn btn-primary" id="btnImportSubmit">导入</button>
      </div>
    </div>
  </div>

  <!-- ======= API 文档弹窗 ======= -->
  <div class="modal-backdrop" id="apiModal" hidden>
    <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="apiTitle">
      <div class="modal-head">
        <h2 id="apiTitle">快速 API</h2>
        <button class="btn btn-icon btn-ghost modal-close" data-close="apiModal" title="关闭">
          <svg class="ic" viewBox="0 0 16 16"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
        </button>
      </div>
      <div class="modal-body" id="apiDocsBody"></div>
    </div>
  </div>

  <!-- ======= Toast ======= -->
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>

<script src="assets/core.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
