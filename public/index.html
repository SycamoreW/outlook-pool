<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outlook 邮箱池</title>
<style>
  :root {
    --bg: #0a0e1a; --panel: rgba(22,27,42,.72); --border: rgba(99,120,180,.16);
    --text: #e8ecf5; --dim: #8b93b0; --accent: #5b8cff; --accent2: #8b5cf6;
    --ok: #34d399; --warn: #fbbf24; --dead: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; overflow: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(600px 400px at 15% -5%, rgba(91,140,255,.14), transparent 60%),
      radial-gradient(500px 400px at 85% 10%, rgba(139,92,246,.12), transparent 60%),
      radial-gradient(700px 500px at 50% 110%, rgba(52,211,153,.07), transparent 60%);
  }
  /* ===== 顶栏 ===== */
  header {
    height: 58px; padding: 0 22px; display: flex; align-items: center; gap: 14px;
    background: var(--panel); backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; letter-spacing: .3px; }
  .logo .icon {
    width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-size: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 4px 14px rgba(91,140,255,.35);
  }
  .pills { display: flex; gap: 8px; margin-left: 8px; }
  .pill {
    font-size: 12px; padding: 4px 11px; border-radius: 99px;
    background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--dim);
  }
  .pill b { font-weight: 600; }
  .pill.ok b { color: var(--ok); } .pill.warn b { color: var(--warn); } .pill.dead b { color: var(--dead); }
  .spacer { flex: 1; }
  button {
    background: linear-gradient(135deg, var(--accent), #4a76e0); color: #fff; border: 0;
    border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 13px; font-weight: 500;
    transition: transform .12s, box-shadow .12s, opacity .12s;
    box-shadow: 0 2px 10px rgba(91,140,255,.25);
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(91,140,255,.4); }
  button:active { transform: translateY(0); }
  button.ghost { background: rgba(255,255,255,.06); border: 1px solid var(--border); box-shadow: none; color: var(--text); }
  button.ghost:hover { background: rgba(255,255,255,.1); }
  button.danger { background: linear-gradient(135deg, #e05050, #c04040); box-shadow: 0 2px 10px rgba(224,80,80,.25); }
  button:disabled { opacity: .45; cursor: default; transform: none !important; }
  /* ===== 主布局 ===== */
  main { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 58px); }
  #left {
    border-right: 1px solid var(--border); overflow-y: auto;
    background: rgba(14,18,30,.5);
  }
  .panel { padding: 16px; border-bottom: 1px solid var(--border); }
  .panel h3 { font-size: 12px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  textarea {
    width: 100%; height: 100px; background: rgba(0,0,0,.35); color: #cfe0ff;
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font-size: 12px; font-family: "SF Mono", Consolas, monospace; resize: vertical; outline: none;
    transition: border-color .15s;
  }
  textarea:focus { border-color: var(--accent); }
  .btnrow { display: flex; gap: 8px; margin-top: 10px; }
  .btnrow button { flex: 1; }
  #importResult { font-size: 12px; color: var(--ok); margin-top: 8px; min-height: 16px; }
  /* 账号卡片 */
  .acct {
    margin: 8px 12px; padding: 11px 13px; border-radius: 11px; cursor: pointer;
    background: rgba(255,255,255,.03); border: 1px solid transparent;
    display: flex; align-items: center; gap: 10px; font-size: 13px;
    transition: background .12s, border-color .12s, transform .12s;
  }
  .acct:hover { background: rgba(91,140,255,.08); transform: translateX(2px); }
  .acct.active { background: rgba(91,140,255,.14); border-color: rgba(91,140,255,.4); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(52,211,153,.7); }
  .dot.error { background: var(--warn); box-shadow: 0 0 8px rgba(251,191,36,.6); }
  .dot.dead { background: var(--dead); box-shadow: 0 0 8px rgba(248,113,113,.6); }
  .dot.unknown { background: #4a5578; }
  .acct .email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .acct .del { color: var(--dead); background: none; border: 0; box-shadow: none; padding: 2px 7px; font-size: 13px; opacity: 0; transition: opacity .12s; }
  .acct:hover .del { opacity: .8; }
  /* 右侧 */
  #right { display: flex; flex-direction: column; overflow: hidden; }
  #msglist { flex: 0 0 44%; overflow-y: auto; border-bottom: 1px solid var(--border); background: rgba(12,15,26,.4); }
  .msg {
    margin: 8px 14px; padding: 12px 15px; border-radius: 11px; cursor: pointer;
    background: rgba(255,255,255,.03); border: 1px solid transparent; font-size: 13px;
    transition: background .12s, border-color .12s;
  }
  .msg:hover { background: rgba(91,140,255,.08); border-color: rgba(91,140,255,.25); }
  .msg .subj { font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .msg .meta { color: var(--dim); font-size: 12px; }
  .msg .codechip {
    font-family: monospace; font-size: 12px; font-weight: 700; color: var(--ok);
    background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.3);
    padding: 1px 8px; border-radius: 6px; cursor: copy;
  }
  #body { flex: 1; overflow: hidden; padding: 14px 18px; display: flex; flex-direction: column; }
  #bodyWrap { flex: 1; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 30px rgba(0,0,0,.35); }
  #bodyWrap iframe { width: 100%; height: 100%; border: 0; }
  .hint { color: var(--dim); font-size: 13px; padding: 40px 20px; text-align: center; }
  /* 登录 */
  /* 滚动条 */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.2); }
  /* toast */
  #toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: rgba(30,36,56,.95); border: 1px solid var(--border); color: var(--text);
    padding: 10px 20px; border-radius: 10px; font-size: 13px; z-index: 99;
    transition: transform .25s; backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  /* ===== 移动端 ===== */
  @media (max-width: 820px) {
    header { height: auto; min-height: 52px; padding: 8px 12px; gap: 8px; flex-wrap: wrap; }
    .logo { font-size: 15px; }
    .logo .icon { width: 28px; height: 28px; font-size: 14px; border-radius: 8px; }
    .pills { order: 3; width: 100%; margin-left: 0; gap: 6px; flex-wrap: wrap; }
    .pill { font-size: 11px; padding: 3px 9px; }
    header button { padding: 6px 11px; font-size: 12px; border-radius: 7px; }
    main { display: block; height: calc(100vh - 52px); overflow-y: auto; }
    #left { border-right: 0; max-height: none; overflow: visible; }
    .panel { padding: 12px; }
    textarea { height: 80px; font-size: 11px; }
    .acct { margin: 6px 10px; padding: 12px 13px; }
    .acct .del { opacity: .6; padding: 4px 10px; }
    #right { display: block; }
    #msglist { border-bottom: 1px solid var(--border); }
    .msg { margin: 6px 10px; padding: 12px 13px; }
    #body { padding: 10px; }
    #bodyWrap { min-height: 60vh; border-radius: 10px; }
    #right .viewtab { display: flex; border-bottom: 1px solid var(--border); background: rgba(14,18,30,.85); position: sticky; top: 0; z-index: 5; backdrop-filter: blur(10px); }
    #right .viewtab button { flex: 1; background: none; border: 0; box-shadow: none; border-radius: 0; padding: 11px; font-size: 13px; color: var(--dim); border-bottom: 2px solid transparent; }
    #right .viewtab button.on { color: var(--text); border-bottom-color: var(--accent); }
    #right.collapsed-body #body { display: none; }
    #right.collapsed-list #msglist { display: none; }
  }
  @media (min-width: 821px) {
    #right .viewtab { display: none; }
  }
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo"><div class="icon">📮</div>邮箱池</div>
  <div class="pills" id="pills"></div>
  <div class="spacer"></div>
  <button class="ghost" onclick="checkAll(this)">🔄 全部检查</button>
  <button class="ghost" onclick="exportAll()">💾 导出</button>
  <button class="danger" onclick="clearDead()">🧹 清理失效</button>
</header>
<main>
  <div id="left">
    <div class="panel">
      <h3>批量导入</h3>
      <textarea id="importBox" placeholder="每行一个账号：&#10;邮箱----密码----client_id----refresh_token"></textarea>
      <div class="btnrow">
        <button onclick="doImport()">导 入</button>
        <button class="ghost" onclick="loadAccounts()">刷 新</button>
      </div>
      <div id="importResult"></div>
    </div>
    <div id="acctList"></div>
  </div>
  <div id="right" class="collapsed-body">
    <div class="viewtab">
      <button id="tabList" class="on" onclick="switchView('list')">📨 邮件列表</button>
      <button id="tabBody" onclick="switchView('body')">📄 正文</button>
    </div>
    <div id="msglist"><div class="hint">← 点击左侧账号查看收件箱</div></div>
    <div id="body"><div id="bodyWrap" style="background:transparent;box-shadow:none;display:grid;place-items:center"><div class="hint">点击邮件查看正文</div></div></div>
  </div>
</main>
</div>
<div id="toast"></div>

<script>
let curAcct = null;
let autoTimer = null;

function switchView(v) {
  if (window.innerWidth > 820) return;
  const r = document.getElementById('right');
  r.classList.toggle('collapsed-body', v === 'list');
  r.classList.toggle('collapsed-list', v === 'body');
  document.getElementById('tabList').classList.toggle('on', v === 'list');
  document.getElementById('tabBody').classList.toggle('on', v === 'body');
}

function startAutoRefresh() {
  clearInterval(autoTimer);
  autoTimer = setInterval(() => {
    if (curAcct && !document.hidden) loadMsgs(curAcct, true);
  }, 30000);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 2200);
}
function api(p, opt = {}) {
  opt.headers = Object.assign({ 'Content-Type': 'application/json' }, opt.headers || {});
  return fetch('/pool/api' + p, opt).then(r => r.json());
}

async function boot() {
  loadAccounts();
}

async function loadAccounts() {
  const j = await api('/accounts');
  const c = { ok: 0, error: 0, dead: 0, unknown: 0 };
  j.accounts.forEach(a => c[a.status || 'unknown']++);
  document.getElementById('pills').innerHTML =
    `<span class="pill">共 <b>${j.total}</b></span>` +
    (c.ok ? `<span class="pill ok">✅ <b>${c.ok}</b></span>` : '') +
    (c.error ? `<span class="pill warn">⚠️ <b>${c.error}</b></span>` : '') +
    (c.dead ? `<span class="pill dead">❌ <b>${c.dead}</b></span>` : '') +
    (c.unknown ? `<span class="pill">❓ <b>${c.unknown}</b></span>` : '');
  document.getElementById('acctList').innerHTML = j.accounts.map(a => `
    <div class="acct ${curAcct === a.id ? 'active' : ''}" onclick="loadMsgs(${a.id})">
      <span class="dot ${a.status || 'unknown'}"></span>
      <span class="email" title="${esc(a.last_error || a.email)}">${esc(a.email)}</span>
      <button class="del" onclick="event.stopPropagation();delAcct(${a.id})">✕</button>
    </div>`).join('') || '<div class="hint">还没有账号，先导入</div>';
}

async function doImport() {
  const text = document.getElementById('importBox').value;
  if (!text.trim()) return;
  const j = await api('/accounts/import', { method: 'POST', body: JSON.stringify({ text }) });
  document.getElementById('importResult').textContent = `✅ 导入 ${j.ok} 个` + (j.bad.length ? `，跳过 ${j.bad.length} 行` : '');
  document.getElementById('importBox').value = '';
  loadAccounts();
}

async function delAcct(id) { if (!confirm('删除这个账号？')) return; await api('/accounts/' + id, { method: 'DELETE' }); toast('已删除'); loadAccounts(); }
async function clearDead() { if (!confirm('删除所有已失效账号？')) return; const j = await api('/accounts/clear-dead', { method: 'POST' }); toast('已清理 ' + j.removed + ' 个'); loadAccounts(); }

async function checkAll(btn) {
  btn.disabled = true; btn.textContent = '⏳ 检查中…';
  const j = await api('/accounts/check-all', { method: 'POST' });
  btn.disabled = false; btn.textContent = '🔄 全部检查';
  toast(`检查完成：✅${j.ok} ⚠️${j.error} ❌${j.dead}`);
  loadAccounts();
}

const CODE_RE = /(?:code|otp|passcode|pin|验证码|校验码|动态码|代码|is|：|:)[^0-9A-Za-z]{0,15}\b([0-9]{4,8})\b/i;
const CODE_RE2 = /\b([0-9]{6})\b/;
function guessCode(m) {
  const t = (m.subject || '') + '\n' + (m.bodyPreview || '');
  return (t.match(CODE_RE) || t.match(CODE_RE2) || [])[1] || null;
}

async function loadMsgs(id, silent) {
  const isNew = curAcct !== id;
  curAcct = id;
  if (isNew) { loadAccounts(); startAutoRefresh(); }
  if (!silent) document.getElementById('msglist').innerHTML = '<div class="hint">加载中…</div>';
  try {
    const j = await api(`/accounts/${id}/messages?top=15`);
    document.getElementById('msglist').innerHTML = (j.messages || []).map(m => {
      const code = guessCode(m);
      return `
      <div class="msg" onclick="loadBody(${id},'${m.id}')">
        <div class="subj">${esc(m.subject || '(无主题)')}
          ${code ? `<span class="codechip" title="点击复制" onclick="event.stopPropagation();copyCode('${code}')">${code}</span>` : ''}
        </div>
        <div class="meta">${esc(m.from?.emailAddress?.address || '')} · ${new Date(m.receivedDateTime).toLocaleString('zh-CN')}</div>
      </div>`;
    }).join('') || '<div class="hint">收件箱为空</div>';
  } catch (e) {
    if (!silent) document.getElementById('msglist').innerHTML = `<div class="hint">加载失败：${esc(e.message)}</div>`;
  }
}

function copyCode(c) { navigator.clipboard.writeText(c).then(() => toast('验证码 ' + c + ' 已复制')); }

async function loadBody(acctId, msgId) {
  document.getElementById('body').innerHTML = '<div id="bodyWrap" style="background:transparent;box-shadow:none;display:grid;place-items:center"><div class="hint">加载中…</div></div>';
  const j = await api(`/accounts/${acctId}/messages/${encodeURIComponent(msgId)}`);
  const html = j.body?.contentType === 'html' ? j.body.content : `<pre style="white-space:pre-wrap;font-family:inherit;padding:20px">${esc(j.body?.content || '')}</pre>`;
  document.getElementById('body').innerHTML = `<div id="bodyWrap"><iframe sandbox="allow-same-origin" srcdoc="${esc(html, true)}"></iframe></div>`;
  switchView('body');
}

function exportAll() { window.open('/pool/api/accounts/export'); }
function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

boot();
</script>
</body>
</html>
